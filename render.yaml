# Render Blueprint for Soundprint.
#
# Deploy by connecting this repo in the Render dashboard and applying this
# blueprint. See DEPLOYMENT.md for the remaining manual steps (Render
# account/billing setup and the two Spotify secrets, which cannot live in
# this file).
#
# NOTE on cross-service URLs: Render's `fromService` env var reference only
# exposes a service's *private-network* host/port (confirmed against
# https://render.com/docs/blueprint-spec as of 2026-09) - it has no
# property that returns a service's public https:// URL, which is what a
# browser needs for NEXT_PUBLIC_API_BASE_URL and what CORS must match
# against the browser's Origin header. Render assigns each web service a
# public URL of `https://<name>.onrender.com` deterministically from the
# `name` field below, so the two envVars near the bottom of this file
# hardcode that derived URL rather than guessing one. If you rename either
# service or attach a custom domain, update both values to match.

databases:
  - name: play-soundprint-db
    plan: free
    databaseName: soundprint
    user: soundprint

services:
  - type: web
    name: play-soundprint-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: play-soundprint-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://play-soundprint-frontend.onrender.com

  - type: web
    name: play-soundprint-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://play-soundprint-backend.onrender.com
